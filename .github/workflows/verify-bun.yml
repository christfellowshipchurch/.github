name: Verify (Bun)

# Typecheck, optional lint, tests and build for a Bun app. Called from each app repo's own
# workflow; see README.md for how a repo calls it and keeps a required check named `verify`.
on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version, e.g. `1.4.3`. Set this or bun-version-file, not both.
        required: false
        type: string
        default: ''
      bun-version-file:
        description: File holding the Bun version, e.g. `.bun-version`. Set this or bun-version.
        required: false
        type: string
        default: ''
      lint:
        description: Run `bun run lint` after the typecheck.
        required: false
        type: boolean
        default: false
      test-command:
        description: Command that runs the tests.
        required: false
        type: string
        default: bun run test

permissions:
  contents: read

jobs:
  bun:
    name: bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Bun version inputs
        env:
          BUN_VERSION: ${{ inputs.bun-version }}
          BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
        run: |
          if [ -n "$BUN_VERSION" ] && [ -n "$BUN_VERSION_FILE" ] || [ -z "$BUN_VERSION$BUN_VERSION_FILE" ]; then
            echo "::error::Set exactly one of bun-version and bun-version-file."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
          bun-version-file: ${{ inputs.bun-version-file }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        if: ${{ inputs.lint }}
        run: bun run lint

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Build
        run: bun run build
